name: Daily LEGO Sync

on:
  schedule:
    # Runs every day at 8:00 AM UTC (4 AM EST / 3 AM CST)
    - cron: "0 8 * * *"
  push:
    branches: [main]
    paths:
      - "public/manual_sets.json"
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

# Coalesce rapid back-to-back edits to manual_sets.json into a single sync.
# If another sync is already in flight when a new push lands, cancel the
# in-progress run — the newer one will pick up all pending changes.
concurrency:
  group: daily-lego-sync
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync LEGO Data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install \
            gspread \
            google-auth \
            requests \
            requests-oauthlib \
            google-generativeai \
            beautifulsoup4

      - name: Run LEGO sync script
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BL_CONSUMER_KEY: ${{ secrets.BL_CONSUMER_KEY }}
          BL_CONSUMER_SECRET: ${{ secrets.BL_CONSUMER_SECRET }}
          BL_TOKEN: ${{ secrets.BL_TOKEN }}
          BL_TOKEN_SECRET: ${{ secrets.BL_TOKEN_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python sync_lego.py

      - name: Check for data changes
        id: check_changes
        run: |
          git add public/data.json public/manual_sets.json public/images/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated data.json
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "LEGO Sync Bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git commit -m "chore: auto-sync LEGO data [skip ci]"

          # Sync runs can take 10+ minutes. If anyone pushed to main while the
          # script was running (e.g. dashboard adds/removes), our push will
          # fail with non-fast-forward. Rebase and retry a few times.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed on attempt $attempt, rebasing onto origin/main and retrying..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo "Push still failing after 5 attempts"
          exit 1

      - name: Trigger deploy after sync
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            });
